name: Build (Primary)

on:
  workflow_call:

concurrency:
  group: primary-${{ github.workflow }} @ ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libretro-linux:
    name: Build libretro core (Linux)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y cmake ccache ninja-build libsdl2-dev libgtk-3-dev libao-dev libopenal-dev qt6-base-dev

    - name: Build libretro core
      run: .github/scripts/build_libretro.sh
      env:
        TARGET_PRESET: libretro-linux
        LIBRETRO_TARGETS: ares_gb_libretro

    - name: Package libretro core
      run: |
        mkdir -p artifacts
        mapfile -t cores < <(find build -type f -name '*_libretro.so')
        if [ "${#cores[@]}" -eq 0 ]; then
          echo "No libretro cores were produced"
          exit 1
        fi
        for core in "${cores[@]}"; do
          install -Dm755 "$core" "artifacts/$(basename "$core")"
        done
        tar -cvJf libretro-linux.tar.xz -C artifacts .

    - name: Upload libretro core
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: libretro-linux
        path: libretro-linux.tar.xz
