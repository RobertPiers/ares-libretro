name: Build (Linux PR)

on:
  pull_request:
    branches: [ "*" ]

concurrency:
  group: linux-pr-${{ github.workflow }} @ ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    name: Build desktop ares (Linux)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y cmake ccache ninja-build libsdl2-dev libgtk-3-dev libao-dev libopenal-dev qt6-base-dev
    - name: Configure
      run: cmake --preset ubuntu-ci
    - name: Build
      run: cmake --build build --target ares
